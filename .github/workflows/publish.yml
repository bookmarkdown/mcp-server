name: Publish to npm

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@bookmarkdown/mcp-server
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Verify package contents
        run: npm run verify:pack
      - name: Release gate - verify tag and main commit
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          expected_tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
          git fetch origin main
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "Tag $GITHUB_REF_NAME must point to the current main commit." >&2
            exit 1
          fi
      - name: Idempotency gate - check npm registry
        id: registry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const registryUrl = `https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`;
          const response = await fetch(registryUrl);

          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'already-published=false\n');
          } else if (response.status === 200) {
            const publishedVersion = (await response.json()).version;
            if (publishedVersion !== version) {
              throw new Error(`Registry returned unexpected version: ${publishedVersion}`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, 'already-published=true\n');
          } else {
            throw new Error(
              `npm registry returned HTTP ${response.status} while checking version ${version}.`,
            );
          }
          NODE
      - name: Publish package with npm Trusted Publishing
        if: steps.registry.outputs.already-published != 'true'
        run: npm publish --access public
